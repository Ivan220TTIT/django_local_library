<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    {% extends "base_generic.html" %}

{% block content %}
  <h1>Продлить книгу: {{ book_instance.book.title }}</h1>
  <p>Читатель: {{ book_instance.borrower }}</p>
  <p{% if book_instance.is_overdue %} class="text-danger"{% endif %}>Срок возврата: {{ book_instance.due_back }}</p>

  <form action="" method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <input type="submit" value="Продлить">
  </form>
{% endblock %}
  </body>
</html>
